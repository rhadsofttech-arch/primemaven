<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Primemaven Admin</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- login -->
<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <img src="/images/mark.png" alt="" width="64" height="64">
    <h1>Primemaven Admin</h1>
    <p id="loginMsg">Log in to edit your website.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn primary" id="loginBtn">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
    <a href="/" class="back">← Back to website</a>
  </form>
</div>

<!-- app -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="/" target="_blank" rel="noopener"><img src="/images/mark.png" alt="" width="36" height="36"><span>Primemaven<small>Admin</small></span></a>
      <button class="icon-btn only-m" id="closeSide" type="button" aria-label="Close menu">✕</button>
    </div>
    <nav id="sideNav" aria-label="Sections"></nav>
    <div class="side-foot">
      <a href="/" target="_blank" rel="noopener">View website ↗</a>
      <button type="button" id="logout">Log out</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-m" id="openSide" type="button" aria-label="Open menu">☰</button>
      <div class="tb-title"><small id="tbGroup"></small><h1 id="tbTitle">Overview</h1></div>
      <div class="tb-actions">
        <a class="btn ghost" id="viewLink" href="/" target="_blank" rel="noopener">View page ↗</a>
        <span class="dirty" id="dirty" hidden>Unsaved changes</span>
        <button class="btn primary" id="saveBtn" type="button" disabled>Save &amp; publish</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/admin/schema.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
